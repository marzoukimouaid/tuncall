[project]
name = "tuncall"
version = "0.0.0"
description = "Speech and language intelligence for Tunisian Darija customer-support calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mouaid Marzouki" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
    "mlflow-skinny>=3.18.0",
    "jiwer>=4.0.0",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "numpy>=2.5.5",
    "transformers>=5.24.0",
    "openai>=3.60.0",
]

# B-05: torch comes only from one of two conflicting extras.
# Laptop/CI: `uv sync --extra cpu`; Colab: `uv sync --locked --extra gpu`.
# peft, accelerate and pyannote.audio require torch, so they live in the extras too (D-21b, D-23).
[project.optional-dependencies]
cpu = ["torch>=2.9", "torchaudio", "torchcodec", "peft>=0.22.0", "accelerate>=1.16.0", "pyannote.audio>=4.0"]
gpu = ["torch>=2.9", "torchaudio", "torchcodec", "peft>=0.22.0", "accelerate>=1.16.0", "pyannote.audio>=4.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]
torchcodec = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuncall"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["scripts"]  # tests import entry-point scripts

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
