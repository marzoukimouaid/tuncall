# D-82a: images are built and pushed to GHCR by CI, never from home (upload ~0.68 Mbps).
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      # The worker image (CUDA torch) needs more than the runner's free disk.
      - name: Free disk space
        if: matrix.target == 'worker'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tuncall-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/tuncall-${{ matrix.target }}:${{ github.sha }}
