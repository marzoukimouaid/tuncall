# D-83: every check must pass before merging to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # D-71a: the serving tests run against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags; pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra cpu --extra serve

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      # D-83c: the dashboard type-checks and builds inside the required job.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dashboard type-check and build
        working-directory: web
        run: npm ci && npm run build

      # D-83c: PRs build the API image without pushing. The CUDA worker image (several GB)
      # is built only on main, by images.yml.
      - name: API image build
        run: docker build --target api .

      # TODO(Phase 3, D-83a): CPU smoke test (train + eval a few steps on a tiny
      # audio sample with a tiny model), per D-83 item 4.
