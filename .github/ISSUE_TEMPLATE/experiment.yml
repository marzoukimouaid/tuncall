name: Experiment
description: A training / evaluation run or ablation
labels: ["type:experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What do we expect, and why?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Base model, data version, config file, machine.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics and eval sets
      description: e.g. WER / CER on test-domain and test-general.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Fill in when done. Link the MLflow run.
