name: Feature
description: New functionality or a component
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete acceptance criteria.
    validations:
      required: true
  - type: input
    id: decisions
    attributes:
      label: Related decisions
      description: PROJECT.md IDs (e.g. D-87). Open questions must be decided before work starts.
