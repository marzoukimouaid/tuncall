# Phase 5 batch pipeline: the Phase 4 pipeline plus the shipped NLP model per task (D-55a):
# the local contender with the best validation score, the faster one if within 1 point
# (scripts/benchmark_nlp.py --set dev prints the choice). Dev run 2026-11-28: Qwen wins intent
# (+8.6 macro-F1) and entities (+5.8 F1); the encoders win sentiment and tie role (faster).
base: ../phase4/pipeline.yaml
nlp:
  qwen_config: configs/phase5/qwen.yaml
  tasks:
    intent:
      kind: qwen
      base: {id: Qwen/Qwen3-4B-Instruct-2507, revision: cdbee75f17c01a7cc42f958dc650907174af0554}
      path: checkpoints/phase5/qwen/intent/final
    entities:
      kind: qwen
      base: {id: Qwen/Qwen3-4B-Instruct-2507, revision: cdbee75f17c01a7cc42f958dc650907174af0554}
      path: checkpoints/phase5/qwen/entities/final
    sentiment:
      kind: encoder
      base: {id: UBC-NLP/MARBERTv2, revision: fe88db9db8ccdb0c4e1627495f405c44a5f89066}
      path: checkpoints/phase5/encoder/marbertv2/sentiment/best
    role:
      kind: encoder
      base: {id: UBC-NLP/MARBERTv2, revision: fe88db9db8ccdb0c4e1627495f405c44a5f89066}
      path: checkpoints/phase5/encoder/marbertv2/role/best
