# Phase 1 zero-shot benchmark defaults (D-26, D-15a).
test_sets:  # D-15e; the first orders the summary table
  test-general:
    manifest: configs/data/test-general.yaml
  test-domain:
    manifest: configs/data/test-domain.yaml
  telephone:  # test-general through the D-25a landline channel
    manifest: configs/data/test-general.yaml
    channel: telephone
lexicon: configs/data/lexicon.tsv  # D-16c: applied to refs and hyps when scoring
experiment: phase1-baselines
reference_model: farukstt
batch_size: 4  # D-15c: 16 overflows a T4 with large models at beam 5
language: ar
task: transcribe
num_beams: 5
max_new_tokens: 440
